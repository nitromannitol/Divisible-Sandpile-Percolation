automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus (Opus generals; the records do not name the version)"
        - "claude-sonnet (Sonnet generals; the records do not name the version)"
        - "claude-opus-5-5"
        - "gpt-6-astra"
        - "deepseek-v4.1-flash"
        - "glm-5.3"
        - "glm-5.3-flash"
        - "kimi-code/k3-256k"
        - "claude-sonnet-5"
        - "gpt-6-luna"
        - "gpt-5.6-luna"
      framework: >-
        Claude Code (Anthropic) as the supervising harness and, through its
        subagents, the harness of the Opus and Sonnet generals; Codex CLI
        (OpenAI) for gpt-6-astra; a custom Python driver over a hosted API
        (glm_general.py) for the DeepSeek and GLM generals; scripted API
        fan-outs for the glm-5.3-flash and deepseek-v4.1-flash proof drafts;
        Kimi Code CLI for kimi-code/k3-256k
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997 and the shared library
        Lattice-Probability at commit bbe0b90.  Division of labour: a
        supervising Claude Code session, whose model the records do not name,
        set up the frozen-statement scaffold (2026-09-06), carried out the
        author's decisions, executed some of them on main, and merged the agents'
        branches.  Claude Opus generals (Claude Code
        subagents, in shifts from 2026-09-10) worked the continuum and
        tightness nodes, the linearization chain, the downstream main theorems
        including the parts of Theorem 1.3 (2026-09-11), the killed scaling
        remark (2026-09-12) and the dimension greater than four linearization
        and many-limits chain.  gpt-6-astra (Codex CLI, reasoning max) worked
        the dimension-four chain (2026-09-07) and, in runs on 2026-09-12,
        repaired the limiting-crossing, stopping and white-noise work, wrote
        the fourth version of the crossing statement and repaired a merge.
        deepseek-v4.1-flash generals (custom driver) worked the continuum,
        crossing, linearization, dimension greater than four and Brownian ball
        chains (2026-09-11 to 2026-09-15); glm-5.3 generals (custom driver)
        worked the percolation and linearization chain (from 2026-09-10) and
        the growth chain; glm-5.3-flash and deepseek-v4.1-flash drafted
        compile-filtered candidates for short proof bodies, accepted only after
        checking.  Claude Sonnet generals (claude --model sonnet, from
        2026-09-16) continued the many-limits, Brownian ball, crossing, growth
        and Theorem 1.3 work.  kimi-code/k3-256k (Kimi Code CLI) worked on
        Theorem 1.3(i)(b) on a separate branch (2026-09-15/16); its commits
        were not merged.  claude-opus-5-5 wrote Sandpile/MainTheorems.lean,
        the comparator surface Audit/ and this release documentation
        (2026-09-23/24).  A frozen-statement manifest (ledger/manifest.yaml)
        pins each registered statement by the SHA-256 of its text, and the
        tools/ checkers verify the hashes, the axiom closure of every node, a
        warning-free build, coverage of every labelled statement of the paper,
        the clause and exponent readings, and quantifier order.  The Lean
        comparator (leanprover/comparator) was run on all twelve Audit pairs
        on 2026-09-28, at commit 8207a73, and every pair passed with the Lean
        kernel and with the independent nanoda kernel; the results and the
        reproduction steps are in Audit/COMPARATOR_RUNS.md.
        .github/workflows/comparator.yml runs the same check on request.
        Final pass (2026-09-26 and 2026-09-27): a claude-opus-5-5 general in
        Claude Code dispatched claude-sonnet-5 subagents, which proved further
        cited inputs and removed them as hypotheses, updated the Audit surface
        and re-ran the comparator; gpt-6-luna and gpt-5.6-luna (Codex CLI) were
        commissioned for some proofs; the release pins Lattice-Probability at
        commit 9d44b4d4670df393bb86ac5a4e042f215001cddf.
      cost:
        wall_time: >-
          about two and a half weeks of calendar time (2026-09-06 to
          2026-09-23, 1007 commits on main), every paper statement sealed by
          2026-09-18; the comparator surface on 2026-09-23/24
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, supervised by the author, with the author's
        statement-level decisions recorded.  Every statement was
        pinned before its proof was attempted, and proofs were accepted only
        through the manifest and axiom gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    supervision of the author.  Every proof is checked by the Lean kernel and
    Mathlib; the verified library contains no sorry and no custom axiom.  The
    results the paper cites without proof enter as explicit hypotheses, not
    axioms.  The Mathlib-only comparator challenge files
    (Audit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry (the theorem body), which is filled by the
    corresponding Audit/*/Solution.lean.  The shared library
    Lattice-Probability is a separate formalization by the same author, also
    written with AI models, not part of this repository.

fidelity:
  divergences: >-
    CORRESPONDENCE.md records every place where a Lean statement is not
    literally the paper's: the fields are fixed by their one-site law;
    convergence in H^{-s}_loc and in C_loc is stated as convergence in
    distribution of each pairing to the matching Gaussian together with
    tightness of the norms, since Mathlib has no Sobolev space; white noise and
    Brownian motion are predicates, each statement quantified over a
    probability space carrying them, and both are shown non-vacuous by
    construction; an exponential-moment bound is stated with the integrability
    of the exponential; the infinite Green field is the limit of the
    finite-box partial sums; the crossing statements carry the paper's
    continuous-modification clause as an explicit almost-sure hypothesis, and
    the continuum crossing comparison is stated for a field on a probability
    space; the Brownian optimal-stopping minimality holds almost surely; the
    continuum value is read off a continuous modification of the Gaussian heat
    potential; and in Theorem 1.1 the threshold is bound after the witnesses
    and before the density.  The cited results enter as hypotheses whose Lean
    statements are in ASSUMPTIONS.md; that they render the cited theorems
    faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author ruled on the statement-level
    decisions recorded during development.  This is not external peer
    review.

