version: "v0.3"

project:
  name: "Divisible-Sandpile-Percolation"
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Quantitative explosion and percolation of the divisible sandpile"
    authors:
      - "Ahmed Bou-Rabee"
      - "Christoforos Panagiotis"
    id: "arXiv:2609.02829"
    url: "https://arxiv.org/abs/2609.02829"
    type: "manuscript"
    license: ""                 # TODO(author): the license under which the paper is posted
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of the paper (58 labelled statements, registered
    as 70 nodes, one per part of a statement in several parts): percolation of
    the toppled set below mean one (Theorem 1.1), percolation of the critical
    level sets of the finite-time odometer (Theorem 1.2), and the ten parts of
    the critical growth and scaling theorem (Theorem 1.3), with the lemmas,
    propositions and corollaries behind them.  SCOPE BOUNDARY: 26 results the
    paper cites from the literature are stated as propositions in
    Sandpile/External/.  20 of them remain explicit hypotheses of every theorem
    whose proof uses them and are assumed, not proved; ASSUMPTIONS.md lists all
    20 with their Lean statements.  The remaining 6 are proved unconditionally
    here (Sandpile/External/*Proved.lean) and are dropped as hypotheses from
    every statement that used them.  Not formalized: the proof-overview,
    related-work and open-problem subsections, the unlabelled remarks
    (including the nonpercolation remark at low mean, which quotes a Peierls
    argument of Fey, Meester and Redig), and the figures.  The main theorems are
    stated in full in Sandpile/MainTheorems.lean; all twelve are additionally
    restated over a Mathlib-only vocabulary for the Lean comparator (Audit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Sandpile.percolation_below_criticality"
      file: "Sandpile/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Nontriviality/comparator.json"
      literature_dependencies: 
        - "Lawler and Limic, Theorem 4.3.1 and Chapter 6, the ball-killed Green estimates (Sandpile.External.BallGreenBounds), hypothesis"
        - "Kohler-Schindler and Tassion, Theorem 1 and Comment 1, planar RSW (Sandpile.External.PlanarRSW), hypothesis"
        - "Liggett, Schonmann and Stacey, Corollary 1.4 (Sandpile.External.LSSDomination), hypothesis"
        - "Timar, Theorem 3, exterior boundary connectivity (Sandpile.External.ExteriorBoundaryConnected), hypothesis"
        - "Kohler-Schindler and Tassion, Theorem 1, continuum form (Sandpile.External.ContinuumRSW), hypothesis"
        - "Pitt, the Gaussian FKG inequality (Sandpile.External.PittGaussianFKG), hypothesis"
        - "Morters and Peres, Brownian Motion, Chapter 3, the Green function of a ball (Sandpile.External.BallOccupationDensity), hypothesis"
        - "Lawler and Limic, Theorem 2.1.3, the local central limit theorem (Sandpile.External.LocalCLT), hypothesis"
        - "Coquet and Toldo, Theorem 3 and Corollary 4, cube-killed form (Sandpile.External.CubeStoppingStability), hypothesis"
