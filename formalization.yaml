version: "v0.4"

project:
  name: "Divisible-Sandpile-Percolation"
  description: >-
    A Lean 4 / mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of Bou-Rabee and Panagiotis, "Quantitative
    explosion and percolation of the divisible sandpile": percolation of the
    toppled set below mean one (Theorem 1.1), percolation of the critical
    level sets of the finite-time odometer at the explicit scale h(t)
    (Theorem 1.2), and the critical growth and scaling theorem at mean one
    (Theorem 1.3), which covers the growth of the mean odometer and its
    Brownian optimal-stopping scaling limit in dimension at most three, first-order
    determinism, Gaussian fluctuations and the membrane limit in dimension four, and
    the tail-determined growth, the weighted membrane limits and the
    non-convergence of the rescaled fluctuations in dimension at least five.
    Every result the paper cites from the literature is proved in the
    formalization; the certified statements carry some of them as explicit
    hypotheses, and every main theorem also holds without hypotheses.  The
    twelve main theorems, and the hypothesis-free forms of the five whose
    certified statements carry cited results, are independently checked by the
    SandpileAudit/ comparator pairs over a Mathlib-only vocabulary.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Quantitative explosion and percolation of the divisible sandpile"
    authors:
      - "Ahmed Bou-Rabee"
      - "Christoforos Panagiotis"
    id: "arXiv:2609.02829"
    url: "https://arxiv.org/abs/2609.02829"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization, taken as arXiv:2609.02829v1 with the
      corrections listed in paper/CHANGES_FROM_ARXIV.md. Every labelled
      theorem, lemma, proposition and corollary is formalized; see
      status.scope for the scope boundary and fidelity.divergences for the
      differences in form.
    license: "arXiv non-exclusive distribution license 1.0"
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Lattice-Probability (LatticeProb), a separate Lean library by the same
      author, pinned as a git dependency at commit
      751040ea092fcf9ae7de4edb7e4f89af4c5291ec. The formalization uses it for
      the lattice and walk vocabulary and for general probability and analysis.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of the paper (58 labelled statements, registered
    as 69 nodes in Sandpile/Frozen/, one per part of a statement in several
    parts): percolation of the toppled set below mean one (Theorem 1.1),
    percolation of the critical level sets of the finite-time odometer
    (Theorem 1.2), and the ten parts of the critical growth and scaling
    theorem (Theorem 1.3), with the lemmas, propositions and corollaries
    behind them.  The 26 results the paper cites from the literature are
    stated as propositions in Sandpile/External/, and each is proved in the
    formalization (Sandpile/External/*Proved.lean and the shared library).
    Some are explicit hypotheses of certified statements; ASSUMPTIONS.md lists
    those with their statements and the theorems that prove them, and the
    hypothesis-free forms (Sandpile.*_proved, Sandpile/MainTheorems.lean)
    discharge them. Not formalized: the proof-overview,
    related-work and open-problem subsections, the unlabelled remarks
    (including the nonpercolation remark at low mean, which quotes a Peierls
    argument of Fey, Meester and Redig), and the figures.  The main theorems are
    stated in full in Sandpile/MainTheorems.lean; all twelve, and the
    hypothesis-free forms of Theorems 1.1, 1.2, 1.3(i)(a), 1.3(i)(b) and
    1.3(ii)(c), are additionally restated over a Mathlib-only vocabulary for
    the Lean comparator (SandpileAudit/).
  sorry_count: 0
  sorry_count_scope: "Sandpile production library only"
  comparator_challenge_sorry_count: 17
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Sandpile.percolation_below_criticality"
      file: "Sandpile/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SandpileAudit/Nontriviality/comparator.json"
      literature_dependencies:
        - statement: "the planar Russo-Seymour-Welsh crossing comparison, in its integer-lattice site form (Sandpile.External.PlanarRSW); carried as an explicit hypothesis and proved by Sandpile.External.planarRSW_holds"
          source: "Kohler-Schindler and Tassion, Theorem 1 and Comment 1"
        - statement: "stochastic domination of a finite-range dependent field by a product measure (Sandpile.External.LSSDomination); a hypothesis of the certified statement, supplied by Sandpile.External.lssDomination"
          source: "Liggett, Schonmann and Stacey, Corollary 1.4"
        - statement: "connectivity of the exterior vertex boundary of a finite connected set (Sandpile.External.ExteriorBoundaryConnected); a hypothesis of the certified statement, supplied by Sandpile.External.exteriorBoundaryConnected_holds"
          source: "Timar, Theorem 3"
        - statement: "the continuum crossing comparison for a field on a probability space (Sandpile.External.ContinuumRSW); carried as an explicit hypothesis and proved by Sandpile.External.continuumRSW_holds"
          source: "Kohler-Schindler and Tassion, Theorem 1 and Comment 1, continuum form"
        - statement: "the occupation density of Brownian motion stopped on exiting a Euclidean ball (Sandpile.External.BallOccupationDensity); a hypothesis of the certified statement, supplied by Sandpile.External.ballOccupationDensity_holds"
          source: "Morters and Peres, Brownian Motion, Chapter 3, the Green function of a ball"
        - statement: "stability of the cube-killed optimal-stopping values (Sandpile.External.CubeStoppingStability); carried as an explicit hypothesis and proved by Sandpile.External.cubeStoppingStability_holds"
          source: "Coquet and Toldo, Theorem 3 and Corollary 4, cube-killed form"
