version: "v0.4"

project:
  name: "Divisible-Sandpile-Percolation"
  description: >-
    A Lean 4 / mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of Bou-Rabee and Panagiotis, "Quantitative
    explosion and percolation of the divisible sandpile": percolation of the
    toppled set below mean one (Theorem 1.1), percolation of the critical
    level sets of the finite-time odometer at the explicit scale h(t)
    (Theorem 1.2), and the critical growth and scaling theorem at mean one
    (Theorem 1.3), which covers the growth of the mean odometer and its
    Brownian optimal-stopping scaling limit in dimension at most three, first-order
    determinism, Gaussian fluctuations and the membrane limit in dimension four, and
    the tail-determined growth, the weighted membrane limits and the
    non-convergence of the rescaled fluctuations in dimension at least five.
    Sixteen results the paper cites from the literature are explicit
    hypotheses of the theorems that use them, and ten further cited results
    are proved. The twelve main theorems are independently checked by the
    SandpileAudit/ comparator pairs over a Mathlib-only vocabulary.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Quantitative explosion and percolation of the divisible sandpile"
    authors:
      - "Ahmed Bou-Rabee"
      - "Christoforos Panagiotis"
    id: "arXiv:2609.02829"
    url: "https://arxiv.org/abs/2609.02829"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization, taken as arXiv:2609.02829v1 with the
      corrections listed in paper/CHANGES_FROM_ARXIV.md. Every labelled
      theorem, lemma, proposition and corollary is formalized; see
      status.scope for the scope boundary and fidelity.divergences for the
      differences in form.
    license: ""                 # TODO(author): the license under which the paper is posted
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Lattice-Probability (LatticeProb), a separate Lean library by the same
      author, pinned as a git dependency at commit
      9d44b4d4670df393bb86ac5a4e042f215001cddf. The formalization uses it for
      the lattice and walk vocabulary and for general probability and analysis.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of the paper (58 labelled statements, registered
    as 69 nodes in Sandpile/Frozen/, one per part of a statement in several
    parts): percolation of the toppled set below mean one (Theorem 1.1),
    percolation of the critical level sets of the finite-time odometer
    (Theorem 1.2), and the ten parts of the critical growth and scaling
    theorem (Theorem 1.3), with the lemmas, propositions and corollaries
    behind them.  SCOPE BOUNDARY: 26 results the paper cites from the
    literature are stated as propositions in Sandpile/External/.  16 of them
    are explicit hypotheses of every theorem whose proof uses them and are
    assumed, not proved; ASSUMPTIONS.md lists all 16 with their Lean
    statements.  The other 10 are proved unconditionally here
    (Sandpile/External/*Proved.lean), and none of the twelve main theorems
    carries any of them as a hypothesis.  Not formalized: the proof-overview,
    related-work and open-problem subsections, the unlabelled remarks
    (including the nonpercolation remark at low mean, which quotes a Peierls
    argument of Fey, Meester and Redig), and the figures.  The main theorems are
    stated in full in Sandpile/MainTheorems.lean; all twelve are additionally
    restated over a Mathlib-only vocabulary for the Lean comparator (SandpileAudit/).
  sorry_count: 0
  sorry_count_scope: "Sandpile production library only"
  comparator_challenge_sorry_count: 12
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Sandpile.percolation_below_criticality"
      file: "Sandpile/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SandpileAudit/Nontriviality/comparator.json"
      literature_dependencies:
        - statement: "the planar Russo-Seymour-Welsh crossing comparison, in its integer-lattice site form (Sandpile.External.PlanarRSW); carried as an explicit hypothesis"
